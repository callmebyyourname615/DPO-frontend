          - time [ref=e53]: 27/08/2025
          - paragraph [ref=e54]: "ໃນລະຫວ່າງວັນທີ 20 ຫາ 22 ສິງຫາ 2025, ຄະນະຜູ້ແທນຈາກສໍານັກງານປົກປ້ອງເງິນຝາກ (ສປງ) ແລະ ຄະນະຜູ້ແທນຈາກ 24 ປະເທດ ໄດ້ເຂົ້າຮ່ວມກອງປະຊຸມຂອງຄະນະກໍາມະການປະຈໍາພາກພື້ນອາຊີ-ເອີຣົບ ແລະ ອາຊີ-ປາຊີຟິກ ຂອງສະມາຄົມປະກັນໄພເງິນຝາກສາກົນ (IADI-EARC and APRC Meeting) ແລະ ກອງປະຊຸມສາກົນ ພາຍໃຕ້ຫົວຂໍ້ “ບາດກ້າວສູ່ຍຸກດິຈິຕອນ: ວາງແນວທາງອານາຄົດຂອງລະບົບປະກັນໄພເງິນຝາກ” (Navigating Digital Frontiers: Charting the Future of Deposit Insurance) ໂດຍການເປັນເຈົ້າພາບ ຂອງກອງທຶນປະກັນໄພເງິນຝາກກາຊັກສະຖານ (Kazakhstan Deposit Insurance Fund ຫຼື KDIF) ຮ່ວມກັບ ສະມາຄົມປະກັນໄພເງິນຝາກສາກົນ (IADI) ຊຶ່ງໄດ້ຈັດຂຶ້ນຢູ່ທີ່ເມືອງ ອານມາຕີ (Almaty), ປະເທດ ກາຊັກສະຖານ..."
