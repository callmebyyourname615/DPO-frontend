          - generic [ref=e101]:
            - paragraph [ref=e102]: "ໃນລະຫວ່າງວັນທີ 20 ຫາ 22 ສິງຫາ 2025, ຄະນະຜູ້ແທນຈາກສໍານັກງານປົກປ້ອງເງິນຝາກ (ສປງ) ແລະ ຄະນະຜູ້ແທນຈາກ 24 ປະເທດ ໄດ້ເຂົ້າຮ່ວມກອງປະຊຸມຂອງຄະນະກໍາມະການປະຈໍາພາກພື້ນອາຊີ-ເອີຣົບ ແລະ ອາຊີ-ປາຊີຟິກ ຂອງສະມາຄົມປະກັນໄພເງິນຝາກສາກົນ (IADI-EARC and APRC Meeting) ແລະ ກອງປະຊຸມສາກົນ ພາຍໃຕ້ຫົວຂໍ້ “ບາດກ້າວສູ່ຍຸກດິຈິຕອນ: ວາງແນວທາງອານາຄົດຂອງລະບົບປະກັນໄພເງິນຝາກ” (Navigating Digital Frontiers: Charting the Future of Deposit Insurance) ໂດຍການເປັນເຈົ້າພາບ ຂອງກອງທຶນປະກັນໄພເງິນຝາກກາຊັກສະຖານ (Kazakhstan Deposit Insurance Fund ຫຼື KDIF) ຮ່ວມກັບ ສະມາຄົມປະກັນໄພເງິນຝາກສາກົນ (IADI) ຊຶ່ງໄດ້ຈັດຂຶ້ນຢູ່ທີ່ເມືອງ ອານມາຕີ (Almaty), ປະເທດ ກາຊັກສະຖານ (Kazakhstan)."
            - paragraph [ref=e103]: "ຈຸດປະສົງຂອງການຈັດກອງປະຊຸມໃນຄັ້ງນີ້ ເພື່ອປຶກສາຫາລື ແລະ ແລກປ່ຽນຄວາມຮູ້ ກ່ຽວກັບການປ່ຽນແປງຂອງລະບົບການເງິນໃນຍຸກດິຈີຕອນ ໂດຍສະເພາະແມ່ນບັນດາເຄື່ອງມືທາງການເງິນທີ່ເກີດຂຶ້ນໃໝ່ ເຊັ່ນ: ຫຼຽນດີຈີຕອນ ຫຼື ຫຼຽນຄຣິບໂຕ, ສະກຸນເງິນດີຈີຕອນຂອງທະນາຄານກາງ (CBDC), ເງິນດີຈີຕອນ (E-money) ແລະ ຜົນກະທົບຕໍ່ລະບົບປະກັນໄພເງິນຝາກ ຈາກເຄື່ອງມືທາງການເງິນເຫຼົ່ານີ້."
            - paragraph [ref=e104]: "ໃນກອງປະຊຸມສາກົນ, ຜູ້ວ່າການທະນາຄານແຫ່ງຊາດ ກາຊັກສະຖານ ໄດ້ແຈ້ງໃຫ້ທີ່ປະຊຸມຊາບກ່ຽວກັບຜົນສໍາເລັດຂອງປະເທດກາຊັກສະຖານ ໃນການພັດທະນາເຕັກໂນໂລຊີທາງດ້ານການເງິນ ຊຶ່ງພາຍໃຕ້ກອບແຜນວຽກການຫັນເປັນດິຈິຕອນ ແລະ ໂຄງການພັດທະນາພື້ນຖານໂຄງລ່າງທາງດ້ານການເງິນດິຈິຕອນແຫ່ງຊາດ ແມ່ນໄດ້ຈັດຕັ້ງປະຕິບັດສໍາເລັດໃນຫຼາຍໜ້າວຽກ ເຊັ່ນ: ເຕັກໂນໂລຊີການຊໍາລະເງິນທີ່ກ້າວຫນ້າ, ການທະນາຄານແບບເປີດ, ການຕ້ານການສໍ້ໂກງ ແລະ ການບໍລິການທາງດິຈິຕອນ. ພ້ອມນີ້, ການນໍາໃຊ້ສະກຸນເງິນດິຈິຕອນຂອງທະນາຄານກາງ ໃນຂະແໜງການເງິນຂອງລັດ ກໍກໍາລັງມີການຂະຫຍາຍຕົວເຊັ່ນກັນ."
            - paragraph [ref=e105]: ໃນປະເທດກາຊັກສະຖານ, ການນໍາໃຊ້ສະກຸນເງິນດິຈິຕອນຂອງທະນາຄານກາງ ໃນຂົງເຂດການປົກປ້ອງເງິນຝາກ ແມ່ນຢູ່ໃນໄລຍະຕົ້ນຂອງການສຶກສາ ຊຶ່ງຈະຕ້ອງໄດ້ພິຈາລະນາເພີ່ມເຕີມໃນອະນາຄົດເຖິງຄວາມເປັນໄປໄດ້ຂອງການຈັດຕັ້ງປະຕິບັດຕົວຈິງ ເນື່ອງຈາກເຫັນໄດ້ເຖິງທ່າແຮງທາງດ້ານເຕັກໂນໂລຊີ ແລະ ການນໍາໃຊ້ສະກຸນເງິນດັ່ງກ່າວໃນການດໍາເນີນງານຂອງທະນາຄານ ກໍມີທ່າອ່ຽງຂະຫຍາຍຕົວ. ໄປຄຽງຄູ່ກັນນັ້ນ, ການເຄື່ອນໄຫວວຽກງານຂອງ IADI ໃນປະຈຸບັນ ແມ່ນໄດ້ສຸມໃສ່ບຸລິມະສິດຍຸດທະສາດ 3 ດ້ານ ຊຶ່ງໜຶ່ງໃນນັ້ນແມ່ນການສຶກສາດ້ານດິຈິຕອນ ແລະ ເຕັກໂນໂລຊີທີ່ເກີດຂຶ້ນໃໝ່. ພ້ອມນີ້, ການປົກປ້ອງເງິນຝາກ ແມ່ນປັດໃຈໜຶ່ງທີ່ສ້າງຄວາມເຊື່ອໝັ້ນໃຫ້ແກ່ສັງຄົມ ຕໍ່ການນໍາໃຊ້ການບໍລິການຂອງທະນາຄານ ແລະ ກໍເປັນເຄື່ອງມືໜຶ່ງທີ່ປະກອບສ່ວນເຂົ້າໃນການຮັກສາສະຖຽນລະພາບທາງດ້ານການເງິນໃນທົ່ວໂລກ.
