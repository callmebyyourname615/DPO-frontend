              - link "13/10/2026" [ref=e116] [cursor=pointer]:
                - /url: https://www.dpo.gov.la/anv27year/
              - generic [ref=e117]:
                - text: "ໃນວາລະຂອງພິທີ, ທ່ານ ນ. ວຽງດາລີ ສຸພານຸວົງ ວ່າການແທນຫົວໜ້າສໍານັກງານປົກປ້ອງເງິນຝາກ ໄດ້ຂຶ້ນລາຍງານຫຍໍ້ກ່ຽວກັບຜົນສໍາເລັດການຈັດຕັ້ງປະຕິບັດວຽກງານຂອງ ສປງ ໃນໄລຍະຜ່ານມາ ແລະ ແຜນການໃນຕໍ່ໜ້າ. ຈາກນັ້ນ, ໄດ້ມີພິທີມອບໃບຍ້ອງຍໍໃຫ້ແກ່ບັນດາສະມາຊິກຂອງ ສປງເພື່ອເປັນການສະແດງຄວາມຍ້ອງຍໍຊົມເຊີຍ ຕໍ່ບັນດາສະມາຊິກ ທີ່ມີຜົນງານໃນການປະກອບສ່ວນເຂົ້າໃນການພັດທະນາວຽກງານປົກປ້ອງເງິນຝາກ ໃນໄລຍະຜ່ານມາ ຊຶ່ງປະກອບມີທັງໝົດ: 41 ແຫ່ງ ໃນນີ້ມີທະນາຄານທຸລະກິດ ຈໍານວນ 35 ແຫ່ງ ແລະ ສະຖາບັນການເງິນຈຸລະພາກທີ່ຮັບເງິນຝາກ ຈໍານວນ 06 ແຫ່ງ ຍັງບໍ່ທັນເປັນສະມາຊິກ 16 ແຫ່ງ. ໃນໂອກາດອັນມີຄວາມໝາຍຄວາມສໍາຄັນນີ້, ທ່ານ ສຸລິສັກ ທໍານຸວົງ ຮອງຜູ້ວ່າການທະນາຄານແຫ່ງ ສປປ ລາວ, ປະທານສະພາບໍລິຫານ ສໍານັກງານປົກປ້ອງເງິນຝາກ ໄດ້ໃຫ້ກຽດຂຶ້ນມີຄໍາເຫັນໂອ້ລົມ ແລະ ສະແດງຄວາມຍ້ອງຍໍຊົມເຊີຍຕໍ່ຜົນງານທີ່ ສປງ ທີ່ຍາດມາໄດ້ຕະຫຼອດ 27 ປີ. ທ່ານໄດ້ເນັ້ນໜັກວ່າ ໃນໄລຍະໃໝ່ທີ່ເສດຖະກິດ-ການເງິນ..."
