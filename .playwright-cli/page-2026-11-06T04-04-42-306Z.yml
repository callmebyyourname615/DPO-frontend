                - text: "ສໍານັກງານປົກປ້ອງເງິນຝາກ ເຂົ້າຮ່ວມຝຶກອົບຮົມ KDIC Global Training Program ປະຈໍາປີ 2026 ໃນລະຫວ່າງວັນທີ 15-18 ກັນຍາ 2026, ຄະນະຜູ້ແທນຈາກ ສໍານັກງານປົກປ້ອງເງິນຝາກ ນໍາພາໂດຍ ທ່ານວ່າການແທນຫົວໜ້າ ສປງ, ຮອງຫົວໜ້າ ສປງ ແລະ ວິຊາການ ລວມທັງໝົດ 04 ທ່ານ ໄດ້ເຂົ້າຮ່ວມການຝຶກອົບຮົມ KDIC Global Training Program ປະຈໍາປີ 2026 ພາຍໃຕ້ຫົວຂໍ້: “ການແກ້ໄຂບັນຫາ ແລະ ການເກັບກູ້ຊັບສິນ” ພາຍໃຕ້ການເປັນເຈົ້າພາບຂອງ ປະກັນໄພເງິນຝາກເກົາຫຼີ (Korea Deposit Insurance Corporation ຫຼື KDIC) ທີ່ປະເທດ ສ. ເກົາຫຼີ ໂດຍມີຜູ້ຕາງໜ້າຈາກ 26 ປະເທດເຂົ້າຮ່ວມ..."
