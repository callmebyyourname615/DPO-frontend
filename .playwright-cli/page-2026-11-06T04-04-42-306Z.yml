                - heading "ສຳນັກງານປົກປ້ອງເງິນຝາກ(ສປງ) ເຂົ້າຮ່ວມງານ”ເທດສະການຄຳລາວ2026″(Lao Gold Festival 2026)" [level=3] [ref=e141]
              - link "16/09/2026" [ref=e144] [cursor=pointer]:
                - /url: https://www.dpo.gov.la/laogoldfestival2026/
              - generic [ref=e145]:
                - text: ໃນວັນທີ 4-6 ກັນຍາ 2026 ທີ່່ຜ່ານມາ, ສໍານັກງານປົກປ້ອງເງິນຝາກ (ສປງ) ໄດ້ເຂົ້າຮ່ວມເປີດບູດວາງສະແດງ ເພື່ອສືບຕໍ່ໂຄສະນາເຜີຍແຜ່ວຽກງານປົກປ້ອງເງິນຝາກ ໃຫ້ກັບພໍ່ແມ່ປະຊາຊົນ, ພໍ່ຄ້າຊາວຂາຍ, ພະນັກງານ-ລັດຖະກອນ, ພະນັກງານຂອງສະຖາບັນການເງິນ, ທະຫານ-ຕໍາຫຼວດ, ນັກທຸລະກິດທັງພາຍໃນ ແລະ ຕ່າງປະເທດ ທີ່ໄດ້ມາຮ່ວມງານ “ເທດສະການຄຳລາວ 2026” (Lao Gold Festival 2026) ທີ່ຫໍປະຊຸມແຫ່ງຊາດ ຫຼັກ 6, ນະຄອນຫຼວງວຽງຈັນ, ພາຍໃຕ້ຫົວຂໍ້ “ມຸ້ງເນັ້ນການເຊື່ອມໂຍງຄວາມຮ່ວມມື ດ້ວຍການສ້າງຄວາມເຊື່ອໝັ້ນ ແລະ ເຕີບໂຕແບບຍືນຍົງຮ່ວມກັນ”. ໃນພິທີເປີດດັ່ງກ່າວ ໄດ້ຮັບກຽດເຂົ້າຮ່ວມຂອງ ພະນະທ່ານ ສອນໄຊ ສີພັນດອນ ນາຍົກລັດຖະມົນຕີ ແຫ່ງ ສປປ ລາວ ເປັນປະທານ, ພ້ອມດ້ວຍບັນດາການນຳພັກ-ລັດ, ຜູ້ຕາງໜ້າບັນດາກະຊວງ, ອົງການຂອງລັດ, ສະຖານທູດ, ອົງການຈັດຕັ້ງສາກົນສະພາການຄ້າ, ສະມາຄົມຄຳ, ສະຖາບັນການເງິນ,...
                - link "ອ່ານເພີ່ມເຕີມ" [ref=e146] [cursor=pointer]:
