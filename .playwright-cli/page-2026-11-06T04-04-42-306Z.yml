                - heading "ສຳນັກງານປົກປ້ອງເງິນ(ສປງ)ຝາກຮ່ວມກັບ ປະກັນໄພເງິນຝາກ ສສ ຫວຽດນາມ(DIV) ຈັດກອງປະຊຸມແລກປ່ຽນບົດຮຽນ ແລະ ທົບທວນວຽກງານວິຊາສະເພາະດ້ານການປົກປ້ອງເງິນຝາກ." [level=3] [ref=e99]
              - link "27/10/2026" [ref=e102] [cursor=pointer]:
