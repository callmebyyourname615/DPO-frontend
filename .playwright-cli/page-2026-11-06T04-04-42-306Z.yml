                - heading "ຄະນະຮັບຜິດຊອບຄົ້ນຄວ້າສ້າງກົດໝາຍວ່າດ້ວຍການປົກປ້ອງເງິນຝາກລາຍງານການຄົ້ນຄວ້າຄຳເຫັນຕໍ່ຮ່າງກົດໝາຍ ຕໍ່ກອງປະຊຸມສະພາແຫ່ງຊາດ" [level=3] [ref=e85]
              - link "29/10/2026" [ref=e88] [cursor=pointer]:
                - /url: https://www.dpo.gov.la/dporaw/
              - generic [ref=e89]:
                - text: "ໃນວັນທີ 21 ຕຸລາ 2026 ນີ້, ທ່ານ ສຸລິສັກ ທຳນຸວົງ, ຮອງຜູ້ວ່າການ ທະນາຄານແຫ່ງ ສປປ ລາວ (ທຫລ), ຫົວໜ້າຄະນະຮັບຜິດຊອບຄົ້ນຄວ້າສ້າງກົດໝາຍວ່າດ້ວຍການປົກປ້ອງເງິນຝາກ ໄດ້ຂຶ້ນລາຍງານການຄົ້ນຄວ້າຄຳເຫັນຂອງສະມາຊິກສະພາແຫ່ງຊາດ ຕໍ່ຮ່າງກົດໝາຍວ່າດ້ວຍການປົກປ້ອງເງິນຝາກ ຕໍ່ກອງປະຊຸມສະໄໝສາມັນ ເທື່ອທີ 2 ຂອງສະພາແຫ່ງຊາດຊຸດທີ X ທີ່ໄດ້ມີຄໍາເຫັນໃນວາລະກອງປະຊຸມ ຄັ້ງວັນທີ 19 ຕຸລາ 2026. ທ່ານ ສຸລິສັກ ທຳນຸວົງໄດ້ລາຍງານວ່າ: ບັນດາທ່ານສະມາຊິກສະພາແຫ່ງຊາດ ໄດ້ມີຄຳເຫັນຕໍ່ຮ່າງກົດ ໝາຍວ່າດ້ວຍການປົກປ້ອງເງິນຝາກ ຈໍານວນ 31 ທ່ານ, ຕິດພັນກັບ 29 ມາດຕາ ກວມເອົາ 71 ເນື້ອໃນ ຊຶ່ງຄໍາເຫັນດັ່ງກ່າວໄດ້ສ່ອງແສງໃຫ້ເຫັນບັນຫາ ແລະ ສະພາບຄວາມເປັນຈິງ ໃນການເຄື່ອນໄຫວວຽກງານປົກປ້ອງເງິນຝາກ ໄດ້ເປັນຢ່າງດີ ພ້ອມທັງມີຄວາມເປັນຫ່ວງເປັນໃຍກ່ຽວກັບບາງກົນໄກການຈັດຕັ້ງປະຕິບັດ ທີ່ກຳນົດໄວ້ໃນຮ່າງກົດໝາຍສະບັບນີ້ ຊຶ່ງເຫັນວ່າເປັນຄຳເຫັນທີ່ມີຄວາມໝາຍ, ຄວາມສຳຄັນ..."
