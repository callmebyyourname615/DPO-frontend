              - generic [ref=e103]:
                - text: ໃນວັນທີ 06-07 ຕຸລາ 2026 ທີ່ໂຮງແຮມ ຮໍລິເດອິນ (Holiday Inn) ນະຄອນຫຼວງວຽງຈັນ, ສໍານັກງານປົກປ້ອງເງິນຝາກ (ສປງ) ຮ່ວມກັບ ປະກັນໄພເງິນຝາກຫວຽດນາມ (Deposit Insurance of Vietnam - DIV) ໄດ້ຈັດກອງປະຊຸມແລກປ່ຽນບົດຮຽນກ່ຽວກັບການປົກປ້ອງເງິນຝາກ ໂດຍການໃຫ້ກຽດເປັນປະທານຮ່ວມຂອງ ທ່ານ ນ. ວຽງດາລີ ສຸພານຸວົງ ວ່າການແທນຫົວໜ້າ ສປງ ແລະ ທ່ານ ນ. ຮວ່າງ ທິ ເຟືອງ ແຮງ (Hoang Thi Phuong Hanh) ກໍາມະການສະພາບໍລິຫານ DIV ພ້ອມດ້ວຍການເຂົ້າຮ່ວມຂອງ ຄະນະ ສປງ, ຄະນະພະແນກ ແລະ ວິຊາການ ຂອງທັງສອງພາກສ່ວນ ເຂົ້າຮ່ວມທັງໝົດ ຈໍານວນ 54...
